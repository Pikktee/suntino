<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <main class="app-view app-view--main" id="mainView">
  <!-- ============ Kopfaktionen ============ -->
  <header class="topbar" aria-label="Suntino Aktionen">
    <div class="topbar-actions">
      <button class="icon-btn" id="reloadBtn" type="button" title="Neu zusammenfassen" aria-label="Neu zusammenfassen">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"></path><path d="M21 3v6h-6"></path>
        </svg>
      </button>
      <button class="icon-btn" id="settingsBtn" type="button" title="Einstellungen" aria-label="Einstellungen" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- ============ Quell-Seite ============ -->
  <div class="source-card" id="sourceCard">
    <img id="favicon" class="favicon" alt="" />
    <div class="source-text">
      <p class="source-title" id="sourceTitle" aria-live="polite">Lese Seite …</p>
      <p class="source-meta" id="sourceMeta"></p>
    </div>
  </div>

  <!-- ============ Kompakte Steuerung ============ -->
  <section class="control-strip" aria-label="Zusammenfassung steuern">
    <label class="compact-field" for="fokusSelect">
      <span>Fokus</span>
      <select id="fokusSelect" class="compact-select"></select>
    </label>
    <label class="compact-field compact-field--small" for="lengthSelect">
      <span>Länge</span>
      <select id="lengthSelect" class="compact-select">
        <option value="kurz">Kurz</option>
        <option value="mittel">Mittel</option>
        <option value="lang">Lang</option>
      </select>
    </label>
  </section>

  <!-- ============ Ergebnis ============ -->
  <div class="result" id="result" hidden>
    <div class="summary-tools" id="summaryTools" hidden aria-label="Zusammenfassung Aktionen">
      <button class="tool-btn" id="copyBtn" type="button" hidden title="Kopieren" aria-label="Zusammenfassung kopieren">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
      <button class="tool-btn" id="downloadBtn" type="button" hidden title="Markdown herunterladen" aria-label="Markdown herunterladen">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="tool-btn" id="ttsBtn" type="button" hidden title="Vorlesen" aria-label="Vorlesen">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      </button>
    </div>
    <div class="summary" id="summary"></div>

  </div>

  <p class="error" id="error" role="alert" hidden></p>

  <section class="qa" id="qa" hidden aria-label="Rückfragen">
    <div class="qa-thread" id="qaThread"></div>
  </section>

  <form class="qa-dock is-disabled" id="qaForm" aria-disabled="true">
    <input class="qa-input" id="qaInput" type="text" placeholder="Rückfrage zur Seite stellen..." autocomplete="off" disabled />
    <button class="qa-send" id="qaSendBtn" type="submit" aria-label="Frage senden" disabled>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </form>
  </main>

  <!-- ============ Einstellungen ============ -->
  <section class="settings-view app-view" id="settingsPanel" aria-label="Einstellungen" hidden>
    <div class="settings-head">
      <button class="back-btn" id="settingsClose" type="button" aria-label="Zurück zur Zusammenfassung">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        <span>Zurück</span>
      </button>
      <h2>Einstellungen</h2>
    </div>

    <label class="set-row" for="zielsprache">
      <span class="set-text"><span class="set-title">Sprache</span><span class="set-desc">Ausgabe der Zusammenfassung</span></span>
      <select id="zielsprache" class="select">
        <option value="de">Deutsch</option>
        <option value="en">Englisch</option>
        <option value="tr">Türkisch</option>
        <option value="fr">Französisch</option>
        <option value="es">Spanisch</option>
      </select>
    </label>

    <label class="set-row">
      <span class="set-text"><span class="set-title">Einfache Sprache</span><span class="set-desc">Kurze Sätze, Niveau B1</span></span>
      <span class="switch">
        <input type="checkbox" id="plain" />
        <span class="track" aria-hidden="true"></span>
      </span>
    </label>

    <label class="set-row">
      <span class="set-text"><span class="set-title">Automatisch aktualisieren</span><span class="set-desc">Neue Seite automatisch zusammenfassen</span></span>
      <span class="switch">
        <input type="checkbox" id="autoRun" checked />
        <span class="track" aria-hidden="true"></span>
      </span>
    </label>

    <section class="focus-settings" aria-labelledby="customFocusTitle">
      <div class="settings-section-head">
        <div>
          <h3 id="customFocusTitle">Fokus-Punkte</h3>
          <p>Modi bearbeiten, löschen, neu anlegen oder zurücksetzen.</p>
        </div>
        <div class="focus-head-actions">
          <button class="mini-btn" id="focusReset" type="button">Reset</button>
          <button class="mini-btn mini-btn--primary" id="customFocusNew" type="button" title="Neuen Fokus-Punkt erstellen">Neu</button>
        </div>
      </div>
      <div class="focus-manager">
        <div class="custom-focus-list" id="customFocusList"></div>
      </div>
    </section>

    <div class="focus-dialog-scrim" id="focusDialogScrim" hidden></div>
    <div class="focus-dialog" id="focusDialog" role="dialog" aria-modal="true" aria-labelledby="customFocusEditorTitle" hidden>
      <form class="custom-focus-form" id="customFocusForm">
        <div class="focus-editor-head">
          <div>
            <h4 id="customFocusEditorTitle">Neuen Fokus erstellen</h4>
            <p>Speichert nur diesen Fokus-Punkt. Die Zusammenfassung wird erst beim Zurückgehen aktualisiert.</p>
          </div>
          <button class="icon-btn" id="focusDialogClose" type="button" aria-label="Editor schließen">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <input type="hidden" id="customFocusId" />
        <label>
          <span>Name</span>
          <input id="customFocusName" type="text" maxlength="38" placeholder="z. B. Kritische Fragen" />
        </label>
        <label>
          <span>Anweisung</span>
          <textarea id="customFocusPrompt" rows="5" maxlength="1800" placeholder="Beschreibe, worauf Suntino achten soll."></textarea>
        </label>
        <div class="form-actions">
          <button class="mini-btn mini-btn--danger" id="customFocusDelete" type="button" hidden>Löschen</button>
          <button class="mini-btn mini-btn--primary" type="submit">Fokus speichern</button>
        </div>
      </form>
    </div>
  </section>

  <script src="sidepanel.js"></script>
</body>
</html>
